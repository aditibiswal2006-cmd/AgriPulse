<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AgriPulse – Farmer Dashboard</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">
        <span class="logo-icon">🌾</span>
        <span class="logo-text">AgriPulse</span>
      </div>
      <div class="topbar-right">
        <div class="user-chip">
          <span class="user-chip-icon">👨‍🌾</span>
          <span id="farmer-welcome">Farmer</span>
        </div>
        <button class="btn btn-logout" id="logout-btn">Logout</button>
      </div>
    </div>
  </header>

  <div class="page-wrapper">

    <!-- Left: Submit Form -->
    <aside class="sidebar-form">
      <div class="card">
        <div class="card-heading">
          <span class="card-heading-icon">📝</span>
          <div>
            <h2>Submit a Query</h2>
            <p>Describe your agricultural issue</p>
          </div>
        </div>

        <form id="query-form" novalidate>

          <div class="form-group">
            <label for="q-category">Category <span class="req">*</span></label>
            <select id="q-category" required>
              <option value="">— Select Category —</option>
              <option value="Crop Disease">🌿 Crop Disease</option>
              <option value="Irrigation">💧 Irrigation</option>
              <option value="Soil Management">🪨 Soil Management</option>
              <option value="Pest Control">🐛 Pest Control</option>
              <option value="Seeds & Nursery">🌱 Seeds &amp; Nursery</option>
              <option value="Fertilizer">🧪 Fertilizer &amp; Nutrients</option>
              <option value="Weather">⛅ Weather &amp; Climate</option>
              <option value="Market Prices">📈 Market Prices</option>
              <option value="Other">📋 Other</option>
            </select>
          </div>

          <div class="form-group">
            <label>Priority <span class="req">*</span></label>
            <div class="priority-pills">
              <label class="priority-pill low">
                <input type="radio" name="q-priority" value="Low"/>
                <span>🟢 Low</span>
              </label>
              <label class="priority-pill moderate">
                <input type="radio" name="q-priority" value="Moderate"/>
                <span>🟡 Moderate</span>
              </label>
              <label class="priority-pill critical">
                <input type="radio" name="q-priority" value="Critical"/>
                <span>🔴 Critical</span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label for="q-subject">Subject <span class="req">*</span></label>
            <input type="text" id="q-subject" placeholder="Brief title of your query" required maxlength="120"/>
          </div>

          <div class="form-group">
            <label for="q-description">Description <span class="req">*</span></label>
            <textarea id="q-description" rows="5" placeholder="Describe your problem in detail…" required maxlength="1000"></textarea>
            <div class="char-count"><span id="char-counter">0</span>/1000</div>
          </div>

          <div id="query-error"   class="error-msg   hidden"></div>
          <div id="query-success" class="success-msg hidden"></div>

          <div class="form-actions">
            <button type="submit" class="btn btn-farmer btn-block">🚀 Submit Query</button>
            <button type="reset"  class="btn btn-ghost btn-block" id="clear-form-btn">↺ Clear Form</button>
          </div>
        </form>
      </div>
    </aside>

    <!-- Right: My Queries -->
    <main class="queries-main">
      <div class="card">
        <div class="queries-header">
          <div>
            <h2>📋 My Queries</h2>
            <p id="farmer-id-display" class="muted-text"></p>
          </div>
          <span class="count-badge" id="query-count">0</span>
        </div>

        <!-- Status tabs -->
        <div class="tab-bar">
          <button class="tab active" data-filter="All">All</button>
          <button class="tab" data-filter="Pending">⏳ Pending</button>
          <button class="tab" data-filter="In Progress">🔄 In Progress</button>
          <button class="tab" data-filter="Resolved">✅ Resolved</button>
        </div>

        <div id="queries-list" class="queries-list">
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <h3>No queries yet</h3>
            <p>Submit your first query using the form on the left.</p>
          </div>
        </div>
      </div>
    </main>

  </div><!-- .page-wrapper -->

  <footer class="main-footer">
    <p>🌾 AgriPulse &copy; 2025 &mdash; Empowering Farmers with Digital Support</p>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/farmer.js"></script>
</body>
</html>
